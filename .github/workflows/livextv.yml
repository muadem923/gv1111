name: LiveXTV M3U Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: '2-57/5 * * * *'

permissions:
  contents: write

concurrency:
  group: livextv-m3u-refresh
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      LIVEXTV_MAX_MATCHES: '30'
      LIVEXTV_MAX_SOURCES_PER_MATCH: '3'
      LIVEXTV_MAX_EMBEDS: '45'
      LIVEXTV_BROWSER_WAIT_SECONDS: '7'
      LIVEXTV_LAST_GOOD_TTL_SECONDS: '900'
      LIVEXTV_NEARBY_FALLBACK: '1'
      LIVEXTV_MIN_SOURCE_PAIRS: '6'
      LIVEXTV_NEARBY_MAX_MATCHES: '8'
      LIVEXTV_NEARBY_WINDOW_BEFORE_SECONDS: '10800'
      LIVEXTV_NEARBY_WINDOW_AFTER_SECONDS: '14400'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Select browser
        shell: bash
        run: |
          set -euo pipefail
          if command -v google-chrome >/dev/null 2>&1; then
            echo "LIVEXTV_BROWSER_CHANNEL=chrome" >> "$GITHUB_ENV"
            google-chrome --version
          elif command -v google-chrome-stable >/dev/null 2>&1; then
            echo "LIVEXTV_BROWSER_CHANNEL=chrome" >> "$GITHUB_ENV"
            google-chrome-stable --version
          else
            echo "System Chrome not found; installing bundled Chromium"
            python -m playwright install --with-deps chromium
            echo "LIVEXTV_BROWSER_CHANNEL=chromium" >> "$GITHUB_ENV"
          fi

      - name: Install ffmpeg
        run: |
          if command -v ffprobe >/dev/null 2>&1 && command -v ffmpeg >/dev/null 2>&1; then
            ffprobe -version | head -n 1
          else
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Scan LiveXTV
        run: python livextv_scanner.py

      - name: Print scan summary
        if: always()
        shell: bash
        run: |
          if [ -f scan_report.json ]; then
            python - <<'PY'
          import json
          r=json.load(open('scan_report.json',encoding='utf-8'))
          print('browser_channel=',r.get('browser_channel'))
          print('live_matches=',r.get('live_matches'),'nearby=',r.get('nearby_fallback_matches'),'embeds=',r.get('embed_candidates'),'verified=',r.get('verified_current'),'published=',r.get('published_entries'))
          print('classifications=',r.get('classification_counts'))
          for b in r.get('browser_events',[])[:5]:
              print('\n',b.get('title'),b.get('embed'))
              for e in b.get('events',[])[:20]: print(e)
          PY
          fi

      - name: Upload scan diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livextv-scan-${{ github.run_number }}
          path: |
            livextv.m3u
            scan_report.json
            state/livextv_last_good.json
          if-no-files-found: warn
          retention-days: 3

      - name: Commit refreshed M3U
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add livextv.m3u scan_report.json state/livextv_last_good.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "chore: refresh LiveXTV M3U"
          git push
